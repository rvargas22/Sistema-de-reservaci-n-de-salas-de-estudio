[pytest]
testpaths = pruebas
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra

markers =
    integracion: pruebas que verifican flujos completos entre varias capas o modulos
    contrato: pruebas estructurales y de requisitos tecnicos de la aplicacion
    rnf: pruebas relacionadas con requisitos no funcionales
    rendimiento: pruebas de rendimiento y tiempos de respuesta
    final: pruebas de verificacion final contra la especificacion aprobada